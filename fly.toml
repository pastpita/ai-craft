# Fly.io: one always-on machine runs the world; the world is saved to a volume
app = "ai-craft-pastpita"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  AV_FILE = "/data/world-data.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "aicraft_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
